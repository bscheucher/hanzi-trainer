services:
  postgres:
    image: postgres:16
    container_name: hanzi-postgres
    environment:
      POSTGRES_DB: hanzi
      POSTGRES_USER: hanzi
      POSTGRES_PASSWORD: ${HANZI_DB_PASSWORD:?set HANZI_DB_PASSWORD in .env, see .env.example}
    ports:
      - "5433:5432"   # host 5433: a native PostgreSQL may already use 5432
    volumes:
      - hanzi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzi -d hanzi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hanzi-pgdata:
