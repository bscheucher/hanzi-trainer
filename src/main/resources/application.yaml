spring:
  application:
    name: hanzi-trainer
  config.import: optional:file:.env[.properties]   # local secrets, shared with docker compose
  datasource:
    url: jdbc:postgresql://localhost:5433/hanzi
    username: hanzi
    password: ${HANZI_DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    # Spring AI brings Jackson 2 along; without this Hibernate would pick it for JSONB columns,
    # but the entities use Jackson 3 (tools.jackson) JsonNode.
    properties.hibernate.type.json_format_mapper: jackson3
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 25MB
  threads.virtual.enabled: true
  ai:
    model.chat: ${hanzi.llm.provider}   # only the selected provider's ChatModel is created
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      timeout: ${hanzi.extraction.timeout}    # HTTP backstop if an interrupted call keeps running; exercise calls
                                              # override it with hanzi.llm.exercise-timeout
      # The SDK's own retries (default 2) cover read timeouts and interrupted calls too; spring.ai.retry does not
      # apply to Anthropic. One retry still covers 429/529, and paid duplicates stay rare.
      max-retries: 1
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    retry.max-attempts: 2                     # Ollama only; default 10 with growing backoff would outlive the job timeout
  http.clients.read-timeout: ${hanzi.extraction.timeout}   # RestClient used by the Ollama model

management:
  endpoints.web.exposure.include: health

hanzi:
  cedict:
    file: ./data/cedict/cedict_ts.u8
    import-on-startup: true
  admin:
    enabled: true
  storage:
    upload-dir: ./data/uploads
  llm:
    provider: ${HANZI_LLM_PROVIDER:anthropic}                 # anthropic | ollama
    extraction-model: ${HANZI_EXTRACTION_MODEL:claude-opus-5-5}
    exercise-model: ${HANZI_EXERCISE_MODEL:claude-sonnet-5-5}   # writes sentence exercises, grades translations
    exercise-timeout: 300s   # HTTP timeout of one exercise call: a reply with thinking can take minutes
  extraction:
    max-image-px: 2576     # Claude's high-resolution limit (long edge); smaller costs fewer image tokens
    timeout: 120s
    # max-concurrent: 1    # model calls at once; default 1 for ollama, 2 for anthropic
  exercises:
    default-session-size: 15
