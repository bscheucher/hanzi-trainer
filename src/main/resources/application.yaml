spring:
  application:
    name: hanzi-trainer
  datasource:
    url: jdbc:postgresql://localhost:5433/hanzi
    username: hanzi
    password: hanzi
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 25MB
  threads.virtual.enabled: true

management:
  endpoints.web.exposure.include: health
